name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP entpacken
        run: |
          for f in *.zip; do unzip -o -q "$f"; done
          ls
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: ScreenMirror
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenMirror-APK
          path: ScreenMirror/app/build/outputs/apk/debug/app-debug.apk
